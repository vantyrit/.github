name: Bug report
description: Report something that is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that reliably triggers the problem.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, tag, or commit hash you are using.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, runtime versions, and anything else relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Paste relevant output or attach screenshots. Remove any secrets first.
      render: shell
