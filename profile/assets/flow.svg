<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Idea to design to build to ship"><style>.t{font-family:'Segoe UI',Inter,Arial,sans-serif}.n{font-size:17px;font-weight:700;fill:#EDEFF6}.s{font-size:13px;fill:#9AA3B5}.l{stroke:#FFB02E;stroke-width:2;stroke-dasharray:6 8;animation:fl 1.2s linear infinite;fill:none}@keyframes fl{to{stroke-dashoffset:-14}}</style><rect width="1200" height="200" rx="18" fill="#0B0D12"/><g class="t"><rect x="40" y="56" width="200" height="88" rx="14" fill="#12151C" stroke="#2EE6C9" stroke-opacity=".5"/><text class="n" x="140" y="96" text-anchor="middle">Talk</text><text class="s" x="140" y="120" text-anchor="middle">goals, scope, budget</text><rect x="340" y="56" width="200" height="88" rx="14" fill="#12151C" stroke="#FFB02E" stroke-opacity=".5"/><text class="n" x="440" y="96" text-anchor="middle">Design</text><text class="s" x="440" y="120" text-anchor="middle">clear, modern, usable</text><rect x="640" y="56" width="200" height="88" rx="14" fill="#12151C" stroke="#2EE6C9" stroke-opacity=".5"/><text class="n" x="740" y="96" text-anchor="middle">Build</text><text class="s" x="740" y="120" text-anchor="middle">weekly working demos</text><rect x="940" y="56" width="220" height="88" rx="14" fill="#12151C" stroke="#FFB02E" stroke-opacity=".5"/><text class="n" x="1050" y="96" text-anchor="middle">Ship</text><text class="s" x="1050" y="120" text-anchor="middle">launch, then support</text></g><path class="l" d="M240 100H340"/><path class="l" d="M540 100H640"/><path class="l" d="M840 100H940"/><circle r="5" fill="#FFB02E"><animateMotion dur="3s" repeatCount="indefinite" path="M240 100H340 M340 100H540 M540 100H640 M640 100H840 M840 100H940"/></circle></svg>
