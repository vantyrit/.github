<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="What Vantyr does"><style>.t{font-family:'Segoe UI',Inter,Arial,sans-serif}.h{font-size:22px;font-weight:700;fill:#EDEFF6}.p{font-size:14px;fill:#9AA3B5}.c{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}.ic{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:140;animation:dw 3.2s ease-in-out infinite}@keyframes dw{0%{stroke-dashoffset:140}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-140}}.bd{animation:bd 4s ease-in-out infinite}@keyframes bd{50%{stroke-opacity:.9}}</style><rect width="1200" height="230" fill="#0B0D12" rx="18"/><g class="c" style="animation-delay:0.00s"><rect x="24" y="24" width="270" height="182" rx="16" fill="#12151C" stroke="#FFB02E" stroke-opacity=".3" class="bd" style="animation-delay:0s"/><g transform="translate(50 48) scale(1.1)"><path class="ic" d="M12 36 L24 12 L36 36 M17 28 H31" stroke="#FFB02E" style="animation-delay:0.0s"/></g><text class="t h" x="50" y="136">Web</text><text class="t p" x="50" y="164">Fast, accessible sites and apps</text></g><g class="c" style="animation-delay:0.18s"><rect x="318" y="24" width="270" height="182" rx="16" fill="#12151C" stroke="#2EE6C9" stroke-opacity=".3" class="bd" style="animation-delay:0.5s"/><g transform="translate(344 48) scale(1.1)"><path class="ic" d="M10 14 L24 6 L38 14 L24 22Z M10 24 L24 32 L38 24 M10 34 L24 42 L38 34" stroke="#2EE6C9" style="animation-delay:0.3s"/></g><text class="t h" x="344" y="136">Software</text><text class="t p" x="344" y="164">Tools and APIs for your team</text></g><g class="c" style="animation-delay:0.36s"><rect x="612" y="24" width="270" height="182" rx="16" fill="#12151C" stroke="#FFB02E" stroke-opacity=".3" class="bd" style="animation-delay:1s"/><g transform="translate(638 48) scale(1.1)"><path class="ic" d="M8 38 V26 M18 3