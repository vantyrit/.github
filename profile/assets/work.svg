<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120" role="img" aria-label="Projects we are proud of"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#171B26"/><stop offset="1" stop-color="#0E1118"/></linearGradient><linearGradient id="u" x1="0" x2="1"><stop offset="0" stop-color="#2EE6C9"/><stop offset="1" stop-color="#2EE6C9" stop-opacity="0"/></linearGradient></defs><style>.t{font-family:'Segoe UI',Inter,Arial,sans-serif}.e{font-size:12px;font-weight:700;letter-spacing:4px;fill:#2EE6C9}.h{font-size:38px;font-weight:800;fill:#EDEFF6}.p{font-size:15px;fill:#9AA3B5}.in{animation:i 1s ease-out both}@keyframes i{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.u{transform-origin:left;transform-box:fill-box;animation:u 3.6s ease-in-out infinite}@keyframes u{0%{transform:scaleX(.15)}50%,70%{transform:scaleX(1)}100%{transform:scaleX(.15)}}.d{animation:d 2s ease-out infinite;transform-origin:center;transform-box:fill-box}@keyframes d{0%{transform:scale(.7);opacity:.8}100%{transform:scale(2.4);opacity:0}}</style><rect x="1" y="1" width="878" height="118" rx="18" fill="url(#g)" stroke="#2EE6C9" stroke-opacity=".3"/><circle class="d" cx="34" cy="31" r="4" fill="#2EE6C9"/><circle cx="34" cy="31" r="4" fill="#2EE6C9"/><text class="t e in" x="50" y="35">OUR WORK</text><text class="t h in" x="30" y="76" style="animation-delay:.15s">Projects we are proud of</text><text class="t p in" x="30" y="100" style="animation-delay:.3s">Our pinned repositories, kept up to date automatically.</text><rect class="u" x="30" y="108" width="140" height="3" rx="2" fill="url(#u)"/></svg>
